<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>500 · Error del servidor · CódigoClaro</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172554; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); padding: 36px; border: 1px solid #dbe3ef; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px #17255412; }
    .brand { margin: 0 0 28px; color: #2563eb; font-weight: 700; letter-spacing: .02em; }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; }
    p { color: #475569; line-height: 1.65; }
    a { display: inline-block; margin-top: 12px; padding: 12px 16px; border-radius: 10px; background: #1d4ed8; color: #fff; font-weight: 650; text-decoration: none; }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">CódigoClaro</p>
    <h1>No se pudo cargar esta página</h1>
    <p>Se produjo un error interno. Espera un momento y vuelve a intentarlo.</p>
    <a href="/">Volver a la portada</a>
  </main>
</body>
</html>
