name: CódigoClaro CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodigoClaro_v3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
      - name: Check server syntax
        run: node --check server.js
      - name: Check experimental PostgreSQL tooling syntax
        run: |
          node --check server-postgres.js
          node --check scripts/migrate-postgres.js
          node --check scripts/promote-admin.js
      - name: Run automated tests
        run: npm test
      - name: Check Python tooling syntax
        run: python -m py_compile scripts/generar_temarios.py verificar_entrega.py
      - name: Verify package
        run: python verificar_entrega.py
