name: Publicar demo en GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'CodigoClaro_v3/docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodigoClaro_v3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify static demo
        run: python scripts/verificar_pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: CodigoClaro_v3/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
